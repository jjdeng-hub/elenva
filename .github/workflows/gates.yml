name: gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型门（tsc）
        run: node ./node_modules/typescript/bin/tsc --noEmit
      - name: 用法面探针
        run: node ./node_modules/typescript/bin/tsc -p tools/tsconfig.json
      - name: 样式收敛（应 0 改动）
        run: |
          python3 tools/style-converge.py
          git diff --exit-code
      - name: 启动器构建判定矩阵（四态）
        run: bash tools/test-launcher-matrix.sh
      - name: 生产构建
        run: npm run build
      - name: 模型路由回归（无 cwd 不得 403）
        run: |
          NODE_ENV=production node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 30977 > /tmp/next-models.log 2>&1 &
          APP_PID=$!
          ready=0
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:30977/login"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/next-models.log; exit 1; fi
          code_no_cwd=$(curl -s -o /tmp/models-nocwd.json -w "%{http_code}" "http://127.0.0.1:30977/api/models")
          code_denied=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:30977/api/models?cwd=/tmp")
          kill "$APP_PID" || true
          echo "GET /api/models -> $code_no_cwd ; GET /api/models?cwd=/tmp -> $code_denied"
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/models-nocwd.json','utf8')); if(!Array.isArray(d.allModelList)) throw new Error('allModelList not an array')"
          [ "$code_no_cwd" = "200" ]
          [ "$code_denied" = "403" ]

  launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 探测器找到真实 node（find-node.ps1）
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File bin\find-node.ps1
      - name: npm 调用自检（Windows 不能直接 spawn npm.cmd）
        shell: cmd
        timeout-minutes: 3
        run: node bin\start-launcher.js --selftest-npm
      - name: 桩测试：start.cmd 与中文名 shim
        shell: cmd
        timeout-minutes: 5
        run: |
          mkdir .ci-stub
          > .ci-stub\node.cmd echo @echo off
          >> .ci-stub\node.cmd echo echo STUB-NODE-CALLED
          >> .ci-stub\node.cmd echo exit /b 0
          set "PATH=%CD%\.ci-stub;%PATH%"
          call start.cmd < nul > start-out.txt 2>&1
          type start-out.txt
          findstr /C:"STUB-NODE-CALLED" start-out.txt || exit /b 1
          findstr /C:"[ERROR]" start-out.txt && exit /b 1
          call 启动.cmd < nul > shim-out.txt 2>&1
          type shim-out.txt
          findstr /C:"STUB-NODE-CALLED" shim-out.txt || exit /b 1
      - name: 找不到 node 时：友好报错 + 退出码 1
        shell: cmd
        timeout-minutes: 2
        run: |
          if exist "C:\Program Files\nodejs\node.exe" (
            echo SKIP: runner has C:\Program Files\nodejs -- cannot simulate "no node" here.
            exit /b 0
          )
          set "PATH=%SystemRoot%\system32;%SystemRoot%"
          call start.cmd < nul > start-missing.txt 2>&1
          type start-missing.txt
          if not errorlevel 1 exit /b 1
          findstr /C:"[ERROR] Node.js not found" start-missing.txt || exit /b 1
